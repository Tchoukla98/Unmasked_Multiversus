<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unmasked Multiversus</title>
  <!-- Firebase SDK Compat (chargement sécurisé) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #ec4899;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 10px; }
    
    .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .tab-btn.active { background: var(--primary); border-color: var(--primary); }
    
    .page { display: none; max-width: 800px; margin: 0 auto; }
    .page.active { display: block; }
    
    .panel { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-block; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #475569; }
    .btn-success { background: #22c55e; }
    
    .role-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .role-header { font-size: 1.3rem; font-weight: bold; color: var(--accent); margin-bottom: 8px; }
    .role-power { font-size: 0.85rem; background: #0f172a; padding: 10px; border-radius: 6px; color: #cbd5e1; border-left: 3px solid var(--primary); margin-bottom: 10px; }
    
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
    input[type="text"], input[type="file"] { width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; }
    
    .preview-img { width: 80px; height: 110px; object-fit: cover; border-radius: 6px; margin-top: 8px; border: 1px solid var(--border); }
    
    .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 20px; }
    .card-item { background: #0f172a; border: 2px solid var(--primary); border-radius: 10px; padding: 10px; text-align: center; }
    .card-item img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-top: 5px; }
    
    .badge { background: var(--primary); padding: 4px 10px; border-radius: 15px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <h1>🎭 UNMASKED - Multiversus</h1>
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" id="btn-tab-config">⚙️ Config Rôles (0-9)</button>
      <button type="button" class="tab-btn" id="btn-tab-game">🎮 Espace de Jeu</button>
    </div>
  </header>

  <!-- PAGE CONFIGURATION DES RÔLES -->
  <div id="page-config" class="page active">
    
    <div class="panel">
      <h3>🔥 Firebase Realtime Database</h3>
      <div class="form-group" style="margin-top: 10px;">
        <label>URL de la base :</label>
        <input type="text" id="fb-url" value="https://unmasked-multiversus-default-rtdb.europe-west1.firebasedatabase.app">
      </div>
      <button type="button" class="btn" id="btn-connect-fb">Connecter Firebase</button>
      <div id="fb-status" style="margin-top: 8px; font-size: 0.85rem; color: #4ade80;">Statut : Prêt</div>
    </div>

    <div class="panel" style="display: flex; gap: 8px; flex-wrap: wrap;">
      <button type="button" class="btn" id="btn-save-local">Sauvegarder (Local)</button>
      <button type="button" class="btn btn-secondary" id="btn-save-fb">Enregistrer sur Firebase</button>
      <button type="button" class="btn btn-secondary" id="btn-load-fb">Charger Firebase</button>
      <button type="button" class="btn btn-secondary" id="btn-reset">Réinitialiser</button>
    </div>

    <div id="roles-list"></div>
  </div>

  <!-- PAGE ESPACE DE JEU -->
  <div id="page-game" class="page">
    <div class="panel" style="text-align: center;">
      <h2>Salon de Jeu Multijoueur</h2>
      <p style="color: #94a3b8; margin: 8px 0;">Créez ou rejoignez une partie en ligne</p>
      
      <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 15px;">
        <input type="text" id="player-name" placeholder="Votre Pseudo" style="width: 140px;" value="Joueur 1">
        <input type="text" id="room-code" placeholder="Code Salon" style="width: 120px;">
        <button type="button" class="btn btn-success" id="btn-join-room">Créer / Rejoindre</button>
      </div>

      <div id="room-info" style="display: none; margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px;">
        <h3>Salon : <span id="display-room-code" style="color: var(--accent);"></span></h3>
        <p style="margin-top: 8px;">Joueurs connectés :</p>
        <div id="players-list" style="display: flex; gap: 8px; justify-content: center; margin: 10px 0; flex-wrap: wrap;"></div>
        <button type="button" class="btn" id="btn-start-game">Lancer la Partie 🚀</button>
      </div>
    </div>

    <h3>Aperçu des cartes du jeu</h3>
    <div id="game-preview" class="board"></div>
  </div>

  <script>
    // Échelle des rôles originaux (De 9 à 0)
    const defaultRoles = [
      { rank: 9, official: "Princesse", name: "Princesse Céleste", power: "Si vous défaussez cette carte, vous êtes immédiatement éliminé.", image: "" },
      { rank: 8, official: "Comtesse", name: "Comtesse de l'Ombre", power: "Obligatoire de défausser si vous avez aussi le Roi (7) ou le Prince (5).", image: "" },
      { rank: 7, official: "Roi", name: "Souverain Multivers", power: "Échangez votre main avec un autre joueur.", image: "" },
      { rank: 6, official: "Chancelier", name: "Archiviste du Temps", power: "Piochez 2 cartes, gardez-en 1 et remettez les 2 autres sous le paquet.", image: "" },
      { rank: 5, official: "Prince", name: "Prince Héritier", power: "Un joueur défausse sa main et en pioche une nouvelle.", image: "" },
      { rank: 4, official: "Servante", name: "Gardienne du Bouclier", power: "Protection totale contre les cartes jusqu'à votre prochain tour.", image: "" },
      { rank: 3, official: "Baron", name: "Baron Dueliste", power: "Comparez votre main avec un autre joueur. La carte la plus basse est éliminée.", image: "" },
      { rank: 2, official: "Prêtre", name: "Voyant Oracle", power: "Regardez secrètement la main d'un autre joueur.", image: "" },
      { rank: 1, official: "Garde", name: "Chasseur de Rôles", power: "Devinez la carte d'un joueur. S'il l'a en main, il est éliminé.", image: "" },
      { rank: 0, official: "Espionne", name: "Agent Infiltré", power: "Gagnez 1 point bonus si vous êtes le seul à avoir joué l'Espionne.", image: "" }
    ];

    let rolesData = [];
    try {
      const saved = localStorage.getItem('unmasked_roles');
      rolesData = saved ? JSON.parse(saved) : defaultRoles;
    } catch(e) {
      rolesData = defaultRoles;
    }

    let db = null;
    let currentRoom = null;
    const playerId = "p_" + Math.floor(Math.random() * 100000);

    // Initialisation sécurisée
    document.addEventListener("DOMContentLoaded", function() {
      renderConfig();
      setupEvents();
      initFirebase();
    });

    function setupEvents() {
      document.getElementById('btn-tab-config').onclick = () => switchTab('config');
      document.getElementById('btn-tab-game').onclick = () => switchTab('game');
      document.getElementById('btn-connect-fb').onclick = initFirebase;
      document.getElementById('btn-save-local').onclick = saveLocal;
      document.getElementById('btn-save-fb').onclick = saveFirebase;
      document.getElementById('btn-load-fb').onclick = loadFirebase;
      document.getElementById('btn-reset').onclick = resetRoles;
      document.getElementById('btn-join-room').onclick = joinRoom;
      document.getElementById('btn-start-game').onclick = () => alert("Partie lancée dans le salon " + currentRoom + " !");
    }

    function switchTab(tab) {
      document.getElementById('page-config').classList.toggle('active', tab === 'config');
      document.getElementById('page-game').classList.toggle('active', tab === 'game');
      document.getElementById('btn-tab-config').classList.toggle('active', tab === 'config');
      document.getElementById('btn-tab-game').classList.toggle('active', tab === 'game');
      
      if(tab === 'game') renderPreview();
    }

    function renderConfig() {
      const container = document.getElementById('roles-list');
      container.innerHTML = '';

      rolesData.forEach((role, idx) => {
        const div = document.createElement('div');
        div.className = 'role-card';
        div.innerHTML = `
          <div class="role-header">Rang ${role.rank} : ${role.official}</div>
          <div class="role-power"><strong>Pouvoir :</strong> ${role.power}</div>
          <div class="form-group">
            <label>Nom du Personnage :</label>
            <input type="text" value="${role.name || ''}" onchange="rolesData[${idx}].name = this.value">
          </div>
          <div class="form-group">
            <label>Image (Fichier local) :</label>
            <input type="file" accept="image/*" onchange="handleImageUpload(${idx}, this)">
          </div>
          ${role.image ? `<img src="${role.image}" class="preview-img">` : ''}
        `;
        container.appendChild(div);
      });
    }

    function handleImageUpload(idx, input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          rolesData[idx].image = e.target.result;
          renderConfig();
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function saveLocal() {
      try {
        localStorage.setItem('unmasked_roles', JSON.stringify(rolesData));
        alert("Sauvegardé localement !");
      } catch(e) {
        alert("Erreur de stockage : Les images importées sont trop lourdes. Privilégiez des petites images.");
      }
    }

    function resetRoles() {
      if(confirm("Réinitialiser les cartes ?")) {
        rolesData = JSON.parse(JSON.stringify(defaultRoles));
        localStorage.removeItem('unmasked_roles');
        renderConfig();
      }
    }

    function initFirebase() {
      const url = document.getElementById('fb-url').value.trim();
      const statusEl = document.getElementById('fb-status');
      
      if (!url) return;

      try {
        if (typeof firebase !== 'undefined') {
          if (!firebase.apps.length) {
            firebase.initializeApp({ databaseURL: url });
          }
          db = firebase.database();
          statusEl.innerText = "Statut : Connecté à Firebase ✅";
          statusEl.style.color = "#4ade80";
        } else {
          statusEl.innerText = "Statut : Firebase non disponible (Mode Hors-Ligne)";
          statusEl.style.color = "#f59e0b";
        }
      } catch(e) {
        statusEl.innerText = "Erreur Firebase : " + e.message;
        statusEl.style.color = "#ef4444";
      }
    }

    function saveFirebase() {
      if(!db) return alert("Firebase n'est pas connecté.");
      db.ref('roles_config').set(rolesData)
        .then(() => alert("Cartes envoyées sur Firebase !"))
        .catch(err => alert("Erreur : " + err.message));
    }

    function loadFirebase() {
      if(!db) return alert("Firebase n'est pas connecté.");
      db.ref('roles_config').once('value').then(snap => {
        if(snap.exists()) {
          rolesData = snap.val();
          renderConfig();
          alert("Cartes chargées depuis Firebase !");
        } else {
          alert("Aucune carte trouvée sur Firebase.");
        }
      });
    }

    function renderPreview() {
      const container = document.getElementById('game-preview');
      container.innerHTML = '';
      rolesData.forEach(r => {
        const item = document.createElement('div');
        item.className = 'card-item';
        item.innerHTML = `
          <div style="font-weight:bold; color:var(--accent);">${r.rank} - ${r.name || r.official}</div>
          <div style="font-size:0.75rem; color:#94a3b8;">(${r.official})</div>
          ${r.image ? `<img src="${r.image}">` : '<div style="height:120px; background:#1e293b; margin-top:5px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:#64748b;">Sans image</div>'}
        `;
        container.appendChild(item);
      });
    }

    function joinRoom() {
      const code = document.getElementById('room-code').value.trim().toUpperCase();
      const pName = document.getElementById('player-name').value.trim() || "Joueur";

      if(!code) return alert("Entrez un code de salon !");

      currentRoom = code;
      document.getElementById('display-room-code').innerText = currentRoom;
      document.getElementById('room-info').style.display = 'block';

      if(db) {
        const pRef = db.ref(`rooms/${currentRoom}/players/${playerId}`);
        pRef.set({ name: pName, id: playerId });
        pRef.onDisconnect().remove();

        db.ref(`rooms/${currentRoom}/players`).on('value', snap => {
          const players = snap.val() || {};
          const list = document.getElementById('players-list');
          list.innerHTML = '';
          Object.values(players).forEach(p => {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.innerText = p.name;
            list.appendChild(badge);
          });
        });
      } else {
        document.getElementById('players-list').innerHTML = `<span class="badge">${pName} (Hors-Ligne)</span>`;
      }
    }
  </script>
</body>
</html>
