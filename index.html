<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unmasked Multiversus</title>
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- CSS Externe -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>👑 Love Letter - Unmasked</h1>
    <div class="nav-tabs">
      <button type="button" class="tab-btn active" id="btn-tab-config">⚙️ Config Rôles (0-9)</button>
      <button type="button" class="tab-btn" id="btn-tab-game">🎮 Tapis de Jeu</button>
    </div>
  </header>

  <!-- MODALE CHOIX DU GARDE (RANG 1) -->
  <div id="modal-guard" class="modal-overlay">
    <div class="modal-content">
      <h3 style="color: var(--accent); margin-bottom: 10px;">⚔️ Pouvoir du Garde (Rang 1)</h3>
      <div class="form-group">
        <label>Choisir le Joueur Cible :</label>
        <select id="guard-target-player"></select>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <label>Deviner son Rôle (0 à 9) :</label>
        <select id="guard-target-role"></select>
      </div>
      <button type="button" class="btn btn-success" style="margin-top: 15px; width: 100%;" onclick="confirmGuardAction()">Accuser 🎯</button>
    </div>
  </div>

  <!-- MODALE POPUP RÉSULTAT DU GARDE -->
  <div id="modal-guard-result" class="modal-overlay">
    <div class="modal-content" style="border-color: var(--accent);">
      <h3 id="guard-result-title" style="color: var(--accent); margin-bottom: 10px;">⚔️ Résultat du Garde</h3>
      <p id="guard-result-text" style="font-size: 0.95rem; margin: 15px 0; line-height: 1.4; color: white;"></p>
      <button type="button" class="btn btn-success" style="width: 100%; font-size: 1rem; padding: 10px;" onclick="closeGuardResultModal()">Compris 👍</button>
    </div>
  </div>

  <!-- MODALE CHOIX DU PRÊTRE (RANG 2) -->
  <div id="modal-priest" class="modal-overlay">
    <div class="modal-content">
      <h3 style="color: var(--accent); margin-bottom: 10px;">👁️ Pouvoir du Prêtre (Rang 2)</h3>
      <div class="form-group">
        <label>Choisir le Joueur à Espionner :</label>
        <select id="priest-target-player"></select>
      </div>
      <button type="button" class="btn btn-success" style="margin-top: 15px; width: 100%;" onclick="confirmPriestAction()">Regarder la carte 👁️</button>
    </div>
  </div>

  <!-- MODALE RÉSULTAT DU PRÊTRE (RÉVÉLATION DE LA CARTE) -->
  <div id="modal-priest-result" class="modal-overlay">
    <div class="modal-content" style="border-color: var(--accent);">
      <h3 id="priest-result-title" style="color: var(--accent); margin-bottom: 10px;">👁️ Main Espionnée</h3>
      <div id="priest-result-card" style="display: flex; justify-content: center; margin: 15px 0;"></div>
      <button type="button" class="btn btn-success" style="width: 100%; font-size: 1rem; padding: 10px;" onclick="closePriestResultModal()">Fermer 🔒</button>
    </div>
  </div>

  <!-- PAGE CONFIGURATION -->
  <div id="page-config" class="page active">
    <div class="panel">
      <h3>🔥 Firebase Database</h3>
      <div class="form-group">
        <input type="text" id="fb-url" value="https://unmasked-multiversus-default-rtdb.europe-west1.firebasedatabase.app">
      </div>
      <button type="button" class="btn" id="btn-connect-fb" style="margin-top:6px;">Connecter Firebase</button>
      <span id="fb-status" style="font-size:0.8rem; margin-left:8px;">Statut : Prêt</span>
    </div>

    <div class="panel" style="display:flex; gap:6px; flex-wrap:wrap;">
      <button type="button" class="btn" id="btn-save-local">Sauvegarder Local</button>
      <button type="button" class="btn btn-secondary" id="btn-export-json">💾 Exporter Config</button>
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('file-import-json').click()">📂 Importer Config</button>
      <input type="file" id="file-import-json" accept=".json" style="display:none;" onchange="importJSONConfig(this)">
      <button type="button" class="btn btn-secondary" id="btn-save-fb">Firebase Enregistrer</button>
      <button type="button" class="btn btn-secondary" id="btn-reset">Réinitialiser Rôles</button>
    </div>

    <div id="roles-list"></div>
  </div>

  <!-- PAGE TAPIS DE JEU -->
  <div id="page-game" class="page">
    <div class="panel" style="text-align: center;">
      <h2>Mode de Jeu</h2>
      <div class="mode-select">
        <button type="button" class="mode-btn active" id="mode-multi-btn" onclick="setGameMode('multi')">🌐 Multijoueur en Ligne</button>
        <button type="button" class="mode-btn" id="mode-bot-btn" onclick="setGameMode('bot')">🤖 Joueur vs IA (Robot)</button>
      </div>

      <!-- LOBBY MULTIJOUEUR -->
      <div id="multi-panel">
        <div style="display: flex; gap: 6px; justify-content: center; margin-top: 8px;">
          <input type="text" id="player-name" placeholder="Pseudo" style="width: 120px;" value="Giulian">
          <input type="text" id="room-code" placeholder="Code Salon" style="width: 100px;" value="AAA">
          <button type="button" class="btn btn-success" id="btn-join-room">Rejoindre</button>
        </div>

        <div id="room-info" style="display: none; margin-top: 10px;">
          <p>Joueurs : <span id="players-list"></span></p>
          <button type="button" class="btn btn-success" id="btn-start-game" style="margin-top:6px;">Lancer la Partie 🚀</button>
        </div>
      </div>

      <!-- LOBBY BOT -->
      <div id="bot-panel" style="display: none;">
        <button type="button" class="btn btn-success" onclick="startBotGame()">Démarrer la Partie Solo vs IA 🤖</button>
      </div>
    </div>

    <!-- TAPIS DE JEU -->
    <div id="game-board" class="felt-table" style="display: none;">
      <div>
        <div id="turn-banner" class="turn-banner">En attente...</div>
        <div id="log-banner" class="log-banner">Aucune action récente</div>
      </div>

      <div style="text-align: center;">
        <span id="opponent-status" style="font-size:0.8rem; background:rgba(0,0,0,0.4); padding:4px 10px; border-radius:12px;">Adversaire</span>
      </div>

      <div class="center-mat">
        <div class="deck-slot">
          <div>PIOCHE</div>
          <div id="deck-count" style="font-size:1.4rem; margin-top:4px;">15</div>
        </div>

        <div id="discard-slot-container">
          <div class="discard-slot">
            <span style="color:#94a3b8;">Dernière Carte Jouée</span>
            <span style="font-weight:bold; color:var(--accent); margin-top:5px;">Aucune</span>
          </div>
        </div>
      </div>

      <div>
        <h4 style="margin-bottom:6px; text-align:center; font-size:0.9rem;">Votre Main :</h4>
        <div id="my-hand" class="hand-container"></div>
      </div>
    </div>
  </div>

  <!-- JavaScript Externe -->
  <script src="script.js"></script>
</body>
</html>
