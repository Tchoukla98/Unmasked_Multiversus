<div class="game-board">
  <!-- HAUT : Adversaire -->
  <div class="opponent-hand">
    <div class="card-back" v-for="c in opponentCardCount"></div>
  </div>

  <!-- MILIEU : Tapis de jeu / Défausse -->
  <div class="play-area">
    <div class="played-card" if="lastPlayedCard">
      <img :src="lastPlayedCard.image" :alt="lastPlayedCard.name" />
      <p>{{ lastPlayerName }} a joué : {{ lastPlayedCard.name }} (Rang {{ lastPlayedCard.rank }})</p>
    </div>
  </div>

  <!-- BAS : Ma main -->
  <div class="player-hand">
    <div class="card" v-for="card in myHand" @click="playCard(card)">
      <img :src="card.image" :alt="card.name" />
      <span>{{ card.name }}</span>
    </div>
  </div>
</div>
