<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unmasked-multiversus</title>
  <!-- Firebase SDK App & Realtime Database -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #ec4899;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: var(--accent); font-size: 1.8rem; }
    .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 15px; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: var(--primary); border-color: var(--primary); font-weight: bold; }
    .page { display: none; max-width: 800px; margin: 0 auto; }
    .page.active { display: block; }
    
    /* Config Page Styles */
    .actions-bar { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #475569; }
    .role-card-edit { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
    .role-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .role-number { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
    .role-power { font-size: 0.9rem; background: #0f172a; padding: 10px; border-radius: 6px; color: #cbd5e1; border-left: 3px solid var(--primary); }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.85rem; color: #94a3b8; }
    input[type="text"], input[type="file"] { background: #0f172a; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; }
    .preview-img { width: 60px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .form-row { display: flex; gap: 10px; align-items: center; }

    /* Firebase Config Panel */
    .firebase-panel { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--primary); }
    .firebase-panel input { width: 100%; margin-top: 5px; margin-bottom: 10px; }
    
    /* Game Page Styles */
    .game-lobby { text-align: center; background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 20px; }
    .card-item { background: #0f172a; border: 2px solid var(--primary); border-radius: 8px; padding: 10px; text-align: center; }
    .card-item img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>🎭 UNMASKED - Multiversus</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchPage('config')">⚙️ Config Rôles (0-9)</button>
      <button class="tab-btn" onclick="switchPage('game')">🎮 Espace de Jeu</button>
    </div>
  </header>

  <!-- PAGE DE CONFIGURATION DES RÔLES -->
  <main id="config-page" class="page active">
    
    <!-- PANNEAU CONFIGURATION FIREBASE -->
    <div class="firebase-panel">
      <h3>🔥 Connexion Firebase Realtime Database</h3>
      <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px;">Entrez l'URL de votre base pour synchroniser avec les autres joueurs.</p>
      <div class="form-group">
        <label>Database URL Firebase :</label>
        <input type="text" id="fb-db-url" placeholder="https://unmasked-multiversus-default-rtdb.firebaseio.com/">
      </div>
      <button class="btn" onclick="initFirebase()">Connecter Firebase</button>
      <span id="fb-status" style="margin-left: 10px; font-size: 0.85rem; color: #e2e8f0;">Statut : Non connecté</span>
    </div>

    <div class="actions-bar">
      <div>
        <button class="btn" onclick="saveToLocal()">Sauvegarder Localement</button>
        <button class="btn btn-secondary" onclick="saveToFirebase()">Enregistrer sur Firebase</button>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="loadFromFirebase()">Charger Firebase</button>
        <button class="btn btn-secondary" onclick="resetDefault()">Réinitialiser</button>
      </div>
    </div>

    <div id="roles-container">
      <!-- Les cartes de rang 9 à 0 seront générées dynamiquement en JS -->
    </div>
  </main>

  <!-- PAGE ESPACE DE JEU -->
  <main id="game-page" class="page">
    <div class="game-lobby">
      <h2>Salon de Jeu</h2>
      <p style="margin: 10px 0; color: #94a3b8;">Rejoignez ou créez une partie multijoueur</p>
      <div style="display: flex; justify-content: center; gap: 10px; margin-top: 15px;">
        <input type="text" id="room-code" placeholder="Code de partie (ex: ABCD)" style="width: 200px;">
        <button class="btn">Créer / Rejoindre</button>
      </div>
    </div>

    <h3>Aperçu des cartes du jeu (Synchronisées)</h3>
    <div id="cards-preview" class="board">
      <!-- Aperçu dynamique -->
    </div>
  </main>

  <script>
    // Structure par défaut des rôles originaux (De 9 à 0)
    const defaultRoles = [
      { rank: 9, official: "Princesse", name: "Princesse Céleste", power: "Si vous défaussez cette carte (pour n'importe quelle raison), vous êtes immédiatement éliminé de la manche.", image: "" },
      { rank: 8, official: "Comtesse", name: "Comtesse de l'Ombre", power: "Si vous avez cette carte ET le Roi (7) ou le Prince (5) en main, vous devez obligatoirement défausser la Comtesse.", image: "" },
      { rank: 7, official: "Roi", name: "Souverain Multivers", power: "Choisissez un autre joueur et échangez votre main avec la sienne.", image: "" },
      { rank: 6, official: "Chancelier", name: "Archiviste du Temps", power: "Piochez 2 cartes du paquet, conservez-en 1 et remettez les 2 autres cartes sous le paquet principal.", image: "" },
      { rank: 5, official: "Prince", name: "Prince Héritier", power: "Choisissez n'importe quel joueur (y compris vous-même). Il défausse sa main et en poche une nouvelle.", image: "" },
      { rank: 4, official: "Servante", name: "Gardienne du Bouclier", power: "Jusqu'à votre prochain tour, vous êtes totalement protégé(e) contre les effets des cartes des autres joueurs.", image: "" },
      { rank: 3, official: "Baron", name: "Baron Dueliste", power: "Comparez votre main avec celle d'un autre joueur en secret. Celui qui a le rang le plus bas est éliminé.", image: "" },
      { rank: 2, official: "Prêtre", name: "Voyant Oracle", power: "Regardez secrètement la main d'un autre joueur.", image: "" },
      { rank: 1, official: "Garde", name: "Chasseur de Rôles", power: "Désignez un joueur et nommez un rôle (autre que Garde). S'il a ce rôle en main, il est éliminé.", image: "" },
      { rank: 0, official: "Espionne", name: "Agent Infiltré", power: "Si vous êtes le seul joueur en vie à avoir joué/défaussé une Espionne cette manche, vous gagnez 1 point bonus.", image: "" }
    ];

    let currentRoles = JSON.parse(localStorage.getItem('unmasked_roles')) || defaultRoles;
    let db = null;

    // Navigation entre onglets
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(page === 'config') {
        document.getElementById('config-page').classList.add('active');
        event.target.classList.add('active');
      } else {
        document.getElementById('game-page').classList.add('active');
        event.target.classList.add('active');
        renderPreview();
      }
    }

    // Afficher la liste des rôles dans la page de configuration
    function renderConfig() {
      const container = document.getElementById('roles-container');
      container.innerHTML = '';

      currentRoles.forEach((role, index) => {
        const card = document.createElement('div');
        card.className = 'role-card-edit';
        card.innerHTML = `
          <div class="role-header">
            <div>
              <span class="role-number">Rang ${role.rank}</span>
              <span style="font-weight: bold; margin-left: 10px;">${role.official}</span>
            </div>
          </div>
          <div class="role-power">
            <strong>Pouvoir Officiel (Rang ${role.rank}) :</strong> ${role.power}
          </div>
          <div class="form-row">
            <div class="form-group" style="flex: 1;">
              <label>Nom du Personnage Personnalisé :</label>
              <input type="text" value="${role.name}" onchange="updateRole(${index}, 'name', this.value)">
            </div>
            <div class="form-group">
              <label>Illustration (Upload) :</label>
              <input type="file" accept="image/*" onchange="uploadImage(${index}, this)">
            </div>
            ${role.image ? `<img src="${role.image}" class="preview-img">` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateRole(index, key, value) {
      currentRoles[index][key] = value;
    }

    function uploadImage(index, input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentRoles[index].image = e.target.result;
          renderConfig();
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function saveToLocal() {
      localStorage.setItem('unmasked_roles', JSON.stringify(currentRoles));
      alert("Configuration enregistrée localement !");
    }

    function resetDefault() {
      if(confirm("Réinitialiser les rôles par défaut ?")) {
        currentRoles = JSON.parse(JSON.stringify(defaultRoles));
        saveToLocal();
        renderConfig();
      }
    }

    // Connexion Firebase Realtime Database
    function initFirebase() {
      const dbUrl = document.getElementById('fb-db-url').value.trim();
      if(!dbUrl) return alert("Veuillez entrer une URL de base Firebase valide.");

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp({ databaseURL: dbUrl });
        }
        db = firebase.database();
        document.getElementById('fb-status').innerText = "Statut : Connecté à Firebase ✅";
        document.getElementById('fb-status').style.color = "#4ade80";
      } catch(e) {
        alert("Erreur de connexion Firebase : " + e.message);
      }
    }

    function saveToFirebase() {
      if(!db) return alert("Veuillez d'abord connecter Firebase en haut de la page.");
      db.ref('roles_config').set(currentRoles)
        .then(() => alert("Configuration synchronisée sur Firebase !"))
        .catch(err => alert("Erreur de sauvegarde Firebase : " + err.message));
    }

    function loadFromFirebase() {
      if(!db) return alert("Veuillez d'abord connecter Firebase en haut de la page.");
      db.ref('roles_config').once('value').then(snapshot => {
        if(snapshot.exists()) {
          currentRoles = snapshot.val();
          saveToLocal();
          renderConfig();
          alert("Configuration chargée depuis Firebase !");
        } else {
          alert("Aucune configuration trouvée sur Firebase.");
        }
      });
    }

    // Affichage dans l'espace de jeu
    function renderPreview() {
      const container = document.getElementById('cards-preview');
      container.innerHTML = '';
      currentRoles.forEach(role => {
        const div = document.createElement('div');
        div.className = 'card-item';
        div.innerHTML = `
          <div style="font-weight:bold; color:var(--accent);">${role.rank} - ${role.name}</div>
          <div style="font-size:0.75rem; color:#94a3b8;">(${role.official})</div>
          ${role.image ? `<img src="${role.image}">` : '<div style="height:120px; background:#1e293b; margin-top:5px; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:0.8rem; color:#64748b;">Pas d\'image</div>'}
        `;
        container.appendChild(div);
      });
    }

    // Initialisation au chargement de la page
    renderConfig();
  </script>
</body>
</html>
